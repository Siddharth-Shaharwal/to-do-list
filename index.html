<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container">
        <div class="head">
            <h1>To-Do List</h1>
            <img src="to_do_list.png" alt="list">
        </div>

        <div class="addBar">
            <input type="text" id="write" placeholder="Enter a new task" maxlength="30">
            <button id="add">ADD</button>
        </div>

        <div id="taskContainer">
            <ul id="list">

            </ul>
        </div>

        <div class="underline"></div>

        <div class="footer">
            <p id="count">Total Tasks: 0</p>
            <p id="complete">Completed: 0</p>
            <p id="incomplete">Incomplete: 0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
